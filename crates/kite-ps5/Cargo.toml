[package]
name = "kite-ps5"
description = "Kite Pack's PS5 side: find the Kite helper, connect, send packed copies"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ava1 = "=1.0.9"
if-addrs = "0.15"
kite-pipeline.workspace = true
kite-forge.workspace = true
kite-smp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true
# The end-to-end letting-go test reads what landed back through Forge's reader.
ps5-dump-forge-zstd.workspace = true
ps5upload-fpkg = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "9e3c9c1a38157b2d560345bee0acff1865bfb6f5" }
