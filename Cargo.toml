[workspace]
members = ["crates/*", "app/src-tauri", "third_party/forge-lz4", "third_party/forge-zstd"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
trash = "5"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ctrlc = "3"
tempfile = "3"
assert_cmd = "2"
kite-pipeline = { path = "crates/kite-pipeline" }
kite-forge = { path = "crates/kite-forge" }
kite-session = { path = "crates/kite-session" }
kite-ps5 = { path = "crates/kite-ps5" }
kite-update = { path = "crates/kite-update" }
kite-smp = { path = "crates/kite-smp" }
# PS5 Dump Forge (quer3q), GPL-3.0-or-later. Pinned: move it on purpose, with ampr-emu-ng
# (the runtime packed games get; see the patch below).
ps5-dump-forge-core = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "9e3c9c1a38157b2d560345bee0acff1865bfb6f5" }
ps5-dump-forge-zstd = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "9e3c9c1a38157b2d560345bee0acff1865bfb6f5" }

# Forge patches lzma-rust2 (sevenz-rust2's decoder, data bounded); a [patch] only applies in
# the root workspace, so ours repeats Forge's.
[patch.crates-io]
lzma-rust2 = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "9e3c9c1a38157b2d560345bee0acff1865bfb6f5" }

# Forge's runtime crate, with ampr-emu-ng v0.5.0 in it instead of v0.4.1 (third_party/forge-lz4/
# README.md). Drop this once Forge ships v0.5.0 itself, and move the pin above.
[patch."https://github.com/quer3q/ps5-dump-forge"]
ps5-dump-forge-lz4 = { path = "third_party/forge-lz4" }
# Forge's zstd packer, which stores a chunk that can't shrink without compressing it first
# (third_party/forge-zstd/README.md).
ps5-dump-forge-zstd = { path = "third_party/forge-zstd" }
# Forge's job runner, whose free-space check for a folder pack can go by a sample of the game
# instead of assuming nothing compresses (third_party/forge-core/README.md).
ps5-dump-forge-core = { path = "third_party/forge-core" }

# Forge's hashing and pack writers are slow unoptimised; tests pack real (tiny) games.
[profile.dev.package."*"]
opt-level = 3
# Vendored from Forge (third_party/), so workspace members, which "*" leaves out.
[profile.dev.package.ps5-dump-forge-zstd]
opt-level = 3
[profile.dev.package.ps5-dump-forge-lz4]
opt-level = 3
