[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
trash = "5"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ctrlc = "3"
tempfile = "3"
assert_cmd = "2"
kite-pipeline = { path = "crates/kite-pipeline" }

# Forge's hashing and pack writers are slow unoptimised; tests pack real (tiny) games.
[profile.dev.package."*"]
opt-level = 3
