[workspace]
members = ["crates/*", "app/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0-alpha.2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
trash = "5"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ctrlc = "3"
tempfile = "3"
assert_cmd = "2"
kite-pipeline = { path = "crates/kite-pipeline" }
kite-forge = { path = "crates/kite-forge" }
kite-session = { path = "crates/kite-session" }
# PS5 Dump Forge (quer3q), GPL-3.0-or-later. Pinned: move it on purpose, with ampr-emu-ng.
ps5-dump-forge-core = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "8a3c7d3e4bfeac3b4ddf8e9ff020e819ae8ff1cd" }

# Forge patches lzma-rust2 (sevenz-rust2's decoder, data bounded); a [patch] only applies in
# the root workspace, so ours repeats Forge's.
[patch.crates-io]
lzma-rust2 = { git = "https://github.com/quer3q/ps5-dump-forge", rev = "8a3c7d3e4bfeac3b4ddf8e9ff020e819ae8ff1cd" }

# Forge's hashing and pack writers are slow unoptimised; tests pack real (tiny) games.
[profile.dev.package."*"]
opt-level = 3
