name: release

# A tag like v0.1.0 (or v0.1.0-alpha.2, published as a pre-release) builds the app for every platform and publishes a
# GitHub release with it, the Kite helper and the third-party notices. The command-line tool is not in the downloads
# (build it from source: `cargo build --release -p kite-cli`). Run it by hand to check the builds without publishing.
#
# Every artifact is a single file uploaded as itself (archive: false), so a download from the
# run page is the file, not a zip around it.
#
# Run by hand with `tag` set to publish to a tag that already exists (say, after a failed run),
# built from the branch it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish to this existing tag (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The release's name in file names: the tag, or the branch for a build-only run.
  RELEASE: ${{ inputs.tag || github.ref_name }}

jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-NOTICES.html
      - uses: actions/upload-artifact@v7
        with:
          path: THIRD-PARTY-NOTICES.html
          archive: false

  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19-dev
      - name: PS5 payload SDK
        run: sudo env PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk bash scripts/install-ps5-sdk.sh
      - name: Build the Kite helper for the PS5
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-19
        run: |
          make -C helper ps5
          file helper/kite-helper.elf
          file helper/kite-helper.elf | grep -q "ELF 64-bit LSB .*x86-64"
      - uses: actions/upload-artifact@v7
        with:
          path: helper/kite-helper.elf
          archive: false

  app:
    needs: helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos }
          # 22.04 keeps the AppImage working on older systems.
          - { os: ubuntu-22.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.name }}
      - run: npm ci
        working-directory: app
      # The app carries the Kite helper, to send to the PS5's ELF loader.
      - uses: actions/download-artifact@v8
        with:
          name: kite-helper.elf
          path: helper-elf
          skip-decompress: true
      - name: Build
        working-directory: app
        shell: bash
        env:
          KITE_HELPER_ELF: ${{ github.workspace }}/helper-elf/kite-helper.elf
        run: |
          test -s ../helper-elf/kite-helper.elf
          case "$RUNNER_OS" in
            Windows) npx tauri build --no-bundle ;;
            macOS)
              npx tauri build --target universal-apple-darwin --bundles dmg
              # The whole bundle must be signed (ad hoc), or a downloaded copy won't launch. Checked
              # in the .dmg people download: Tauri removes the .app it made the .dmg from.
              dmg=$(find ../target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
              hdiutil attach -nobrowse -readonly -mountpoint /tmp/kite-dmg "$dmg"
              codesign --verify --deep --strict --verbose=2 "/tmp/kite-dmg/Kite Pack.app"
              hdiutil detach /tmp/kite-dmg
              ;;
            Linux) npx tauri build --bundles appimage ;;
          esac
      - name: Name the file
        shell: bash
        run: |
          base="Kite-Pack-${RELEASE//\//-}-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Windows) cp target/release/kite-app.exe "$base.exe" ;;
            macOS) cp "$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)" "$base.dmg" ;;
            Linux) cp "$(find target/release/bundle/appimage -name '*.AppImage' | head -1)" "$base.AppImage"; chmod +x "$base.AppImage" ;;
          esac
          ls -l Kite-Pack-*
          echo "FILE=$(ls Kite-Pack-*)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.FILE }}
          archive: false

  publish:
    needs: [notices, helper, app]
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
      # As-is: every artifact is one file.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Check the files
        run: |
          cd dist
          ls -l
          for f in *; do
            [ -f "$f" ] || { echo "::error::$f arrived as a folder, not a file"; exit 1; }
          done
          test -s kite-helper.elf || { echo "::error::No kite-helper.elf"; exit 1; }
          for kind in windows-x64.exe macos.dmg linux-x64.AppImage; do
            ls Kite-Pack-*-"$kind" > /dev/null || { echo "::error::No app file for $kind"; exit 1; }
          done
          sha256sum * > SHA256SUMS.txt
      - name: Release notes
        if: env.PUBLISH == 'true'
        run: |
          version="${RELEASE#v}"
          grep -q "^version = \"$version\"" Cargo.toml || {
            echo "::error::$RELEASE is on a commit whose version isn't $version. Was the tag made before the merge?"
            exit 1
          }
          awk -v head="## ${version}" '$0 == head {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: env.PUBLISH == 'true'
        with:
          tag_name: ${{ env.RELEASE }}
          name: Kite Pack ${{ env.RELEASE }}
          body_path: notes.md
          prerelease: ${{ contains(env.RELEASE, '-') }}
          files: dist/*
