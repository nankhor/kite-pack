name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Screen tests and build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19-dev
      - name: PS5 payload SDK
        run: sudo env PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk bash scripts/install-ps5-sdk.sh
      - name: Build the Kite helper for the PS5
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-19
        run: |
          make -C helper ps5
          file helper/kite-helper.elf
          file helper/kite-helper.elf | grep -q "ELF 64-bit LSB .*x86-64"
      - uses: actions/upload-artifact@v7
        with:
          path: helper/kite-helper.elf
          archive: false
